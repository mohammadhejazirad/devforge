name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest

  mypy:
    name: mypy on python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  shell:
    name: shellcheck and shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          sudo chmod 0755 /usr/local/bin/shfmt
          shfmt --version
      - name: Lint shell scripts
        run: |
          mapfile -d '' files < <(find . -name '*.sh' -not -path './.git/*' -not -path './.venv/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts yet."
            exit 0
          fi
          shellcheck "${files[@]}"
          # install.sh uses four spaces and indented case arms.
          shfmt -i 4 -ci -d "${files[@]}"
